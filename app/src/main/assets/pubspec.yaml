name: xerion
description: "Bug WhatsApp Crasher"
publish_to: 'none'
version: 6.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.5
  image_picker: ^1.0.7
  intl: ^0.19.0
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  carousel_slider: ^4.0.0
  web_socket_channel: ^2.4.0
  network_info_plus: ^4.1.0
  permission_handler: ^11.0.0
  video_player: ^2.9.2
  audioplayers: ^6.0.0
  font_awesome_flutter: ^10.7.0
  path_provider: ^2.1.1
  share_plus: ^7.0.1
  chewie: ^1.5.2
  
  # ========== TAMBAHKAN INI ==========
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  shimmer: ^3.0.0           # ✅ TAMBAHKAN (atasi error shimmer)
  webview_flutter: ^4.8.0   # ✅ TAMBAHKAN (atasi error webview)
  # ===================================

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icon/icon.jpg
  image_path_ios: assets/icon/icon.jpg
  image_path: assets/icon/icon.jpg
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg
    - assets/images/logo.png
    - assets/images/reze.png
    - assets/images/custom.jpg
    - assets/images/spam.jpg
    - assets/images/xcv.jpg
    - assets/videos/landing.mp4
    - assets/videos/splash.mp4
    - assets/videos/banner.mp4
    - assets/videos/banner1.mp4
    - assets/videos/splashd.mp4

  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf
    - family: ShareTechMono
      fonts:
        - asset: fonts/ShareTechMono-Regular.ttf
    - family: ARABOLIC
      fonts:
        - asset: fonts/ARABOLIC.ttf
    - family: AROMA
      fonts:
        - asset: fonts/AROMA.ttf